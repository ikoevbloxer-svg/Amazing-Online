name: Build Minecraft Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod (через gradlew)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Показать ошибки на странице сборки
        if: failure()
        run: |
          {
            echo "## Ошибки сборки"
            echo '```'
            grep -nE "error:|warning: \[removal\]|FAILED|What went wrong|Caused by|Could not|Exception|> " build.log | grep -v "^.*> Task .* UP-TO-DATE" | head -200
            echo '```'
            echo "## Конец лога"
            echo '```'
            tail -80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "\.java:[0-9]+: error:" build.log | head -50 | while read -r line; do echo "::error::$line"; done

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rusgorod-mod
          path: build/libs/*.jar
